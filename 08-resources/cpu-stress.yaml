apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress
spec:
  containers:
    - name: stress
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - "while true; do :; done"
      resources:
        requests:
          cpu: "50m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
