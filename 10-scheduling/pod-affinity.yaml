apiVersion: v1
kind: Pod
metadata:
  name: backend-affinity
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: redis
          topologyKey: kubernetes.io/hostname
  containers:
    - name: nginx
      image: nginx:1.27
